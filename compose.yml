x-app: &app
  build: .
  image: library-app:0.1.0
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DEMO_LIBRARIAN_PASSWORD: ${DEMO_LIBRARIAN_PASSWORD:-}
    DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-}
  networks: [backend, outbound]
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.50
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 3
  stop_grace_period: 30s
  security_opt: [no-new-privileges:true]
services:
  app1:
    <<: *app
  app2:
    <<: *app
  nginx:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    user: "101:101"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
    networks: [backend, public]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  backend:
    internal: true
  outbound:
  public:
