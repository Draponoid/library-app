services:
  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    user: "70:70"
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_BIND_IP:?Set DB_BIND_IP to VM2 private IP}:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    networks: [database]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U library -d library']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  db-data:
networks:
  database:
