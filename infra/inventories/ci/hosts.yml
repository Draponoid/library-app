---
all:
  vars:
    ansible_connection: local
  children:
    lab_environment:
      children:
        application:
          hosts:
            lab_app:
              lab_bind_address: 127.0.0.1
              lab_protected_port: "{{ lab_http_port }}"
              lab_allowed_cidr: 127.0.0.1/32
              lab_firewall_suffix: app
        database:
          hosts:
            lab_db:
              lab_bind_address: "{{ ci_docker_host }}"
              lab_protected_port: "{{ lab_db_port }}"
              lab_allowed_cidr: 127.0.0.1/32
              lab_firewall_suffix: db
