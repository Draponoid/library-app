---
- name: Recreate Nginx after configuration change
  community.docker.docker_compose_v2:
    project_src: "{{ lab_base_dir }}/{{ lab_environment }}/application"
    project_name: "library-lab7-{{ lab_environment }}-app"
    services: [nginx]
    dependencies: false
    recreate: always
    state: present
    wait: true
    wait_timeout: 120
  no_log: true
