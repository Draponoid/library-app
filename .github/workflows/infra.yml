name: Infrastructure verification
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Ansible dependencies
        run: |
          python -m pip install -r infra/requirements.txt
          ansible-galaxy collection install -r infra/requirements.yml
      - name: Policy, lint and syntax
        env:
          ANSIBLE_CONFIG: infra/ansible.cfg
        run: |
          python infra/check_policy.py
          ansible-playbook --syntax-check -i infra/inventories/ci/hosts.yml infra/site.yml
          ansible-lint --profile min infra/site.yml
          bash -n infra/test-infra-ci.sh
      - name: Deploy, rerun and repair configuration drift
        run: bash infra/test-infra-ci.sh
      - name: Print container logs on failure
        if: failure()
        run: |
          docker ps -a
          sudo docker compose -p library-lab7-prod-app -f "$RUNNER_TEMP/library-lab7-test/managed/prod/application/compose.yml" logs || true
          sudo docker compose -p library-lab7-prod-db -f "$RUNNER_TEMP/library-lab7-test/managed/prod/database/compose.yml" logs || true
      - name: Remove disposable CI resources
        if: always()
        run: |
          for env in prod staging; do
            for service in application database; do
              suffix=app; if [ "$service" = database ]; then suffix=db; fi
              sudo docker compose -p "library-lab7-$env-$suffix" -f "$RUNNER_TEMP/library-lab7-test/managed/$env/$service/compose.yml" down -v || true
            done
          done
