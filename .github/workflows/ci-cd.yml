name: CI and Docker delivery

on:
  push:
    branches: [master, features]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-docker.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q app.py setup_local.py tests
          node --check static/app.js
          node --test tests/test_ui.cjs

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t library-app:ci .
      - name: Verify running container
        shell: bash
        run: |
          set -euo pipefail
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')
          docker run -d --name library-ci -p 127.0.0.1:5000:5000 -e SECRET_KEY library-app:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /tmp/health.json; then
              python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["status"] == "ok" and d["database"] == "ok"'
              curl --fail --silent http://127.0.0.1:5000/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs library-ci
          exit 1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs library-ci || true
          docker rm -f library-ci || true
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag library-app:ci "$image:sha-${GITHUB_SHA}"
          docker tag library-app:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
