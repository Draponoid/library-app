name: CI and container checks
on:
  push:
    branches: [master, features]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Application tests
        run: |
          python -m pip install -r requirements-docker.txt
          python -m unittest discover -s tests -v
          python -m compileall -q app.py pg_adapter.py scripts
          node --test tests/test_ui.cjs
      - name: Container integration on Linux
        shell: bash
        run: |
          set -euo pipefail
          bridge=$(ip -4 -o addr show docker0 | awk '{print $4}' | cut -d/ -f1)
          {
            echo 'DB_BIND_IP=0.0.0.0'
            echo 'POSTGRES_PASSWORD=integrationtestpassword'
            echo "DATABASE_URL=postgresql://library:integrationtestpassword@${bridge}:5432/library"
            echo 'SECRET_KEY=integration-test-only-secret-key-at-least-32-characters'
            echo 'DEMO_LIBRARIAN_PASSWORD=integration-test-password-1'
            echo 'DEMO_READER_PASSWORD=integration-test-password-2'
          } > .env
          make db-up
          for i in {1..60}; do
            if docker compose -f compose.db.yml exec -T db pg_isready -U library -d library; then break; fi
            sleep 2
          done
          make migrate
          make seed
          make up
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"librarian","password":"integration-test-password-1"}' http://127.0.0.1:8080/api/auth/login > /dev/null
          docker compose -f compose.db.yml exec -T db psql -U library -d library -c "INSERT INTO authors(name) VALUES ('Persistence test')"
          docker compose -f compose.db.yml exec -T db pg_dump -U library -d library -Fc > /tmp/library.dump
          make container-check MODE=db
          docker compose -f compose.db.yml up -d --force-recreate
          for i in {1..60}; do
            if docker compose -f compose.db.yml exec -T db pg_isready -U library -d library; then break; fi
            sleep 2
          done
          test "$(docker compose -f compose.db.yml exec -T db psql -U library -d library -Atc "SELECT COUNT(*) FROM authors WHERE name='Persistence test'")" = 1
          DB_BIND_IP=127.0.0.1 DB_PORT=15432 docker compose -p library-restore -f compose.db.yml up -d
          for i in {1..60}; do
            if DB_BIND_IP=127.0.0.1 DB_PORT=15432 docker compose -p library-restore -f compose.db.yml exec -T db pg_isready -U library -d library; then break; fi
            sleep 2
          done
          DB_BIND_IP=127.0.0.1 DB_PORT=15432 docker compose -p library-restore -f compose.db.yml exec -T db pg_restore -U library -d library --clean --if-exists < /tmp/library.dump
          test "$(DB_BIND_IP=127.0.0.1 DB_PORT=15432 docker compose -p library-restore -f compose.db.yml exec -T db psql -U library -d library -Atc "SELECT COUNT(*) FROM authors WHERE name='Persistence test'")" = 1
          docker compose stop app1
          curl -fsS http://127.0.0.1:8080/health
          test "$(docker inspect "$(docker compose ps -aq app1)" --format '{{.State.ExitCode}}')" = 0
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker tag library-app:0.1.0 "$image"
          docker push "$image"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs || true
          docker compose -f compose.db.yml logs || true
      - name: Cleanup
        if: always()
        run: |
          DB_BIND_IP=127.0.0.1 DB_PORT=15432 docker compose -p library-restore -f compose.db.yml down -v || true
          docker compose down -v || true
          docker compose -f compose.db.yml down -v || true
