name: Library CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Required CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_DIND_NAME: library-ci
      CI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
      CI_REPORT_DIR: ${{ github.workspace }}/.ci-reports
      CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CI_CACHE_DIR }}
          key: ci-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'scripts/ci.sh') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Start Docker-in-Docker
        id: dind
        run: sh scripts/ci-dind.sh start
      - name: Style and syntax
        run: sh scripts/ci-dind.sh style
      - name: Application tests
        run: sh scripts/ci-dind.sh tests
      - name: Build candidate image
        run: sh scripts/ci-dind.sh build
      - name: Migrations on isolated PostgreSQL
        run: sh scripts/ci-dind.sh migrations
      - name: Backup and restore
        run: sh scripts/ci-dind.sh backup
      - name: Secrets dependencies and image security
        if: ${{ !cancelled() && steps.dind.outcome == 'success' }}
        run: sh scripts/ci-dind.sh security
      - name: Container health balancing and failover
        run: sh scripts/ci-dind.sh containers
      - name: Publish verified SHA to local registry
        run: sh scripts/ci-dind.sh registry
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-reports
          path: |
            ${{ env.CI_REPORT_DIR }}/
            !${{ env.CI_REPORT_DIR }}/library-app.tar.gz
          include-hidden-files: true
          if-no-files-found: warn
      - name: Transfer verified image to publication job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-image
          include-hidden-files: true
          path: ${{ env.CI_REPORT_DIR }}/library-app.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Stop Docker-in-Docker
        if: always()
        run: sh scripts/ci-dind.sh stop

  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-image
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run -d --privileged --name publish-dind \
            -e DOCKER_TLS_CERTDIR= \
            -v "$PWD/library-app.tar.gz:/image.tar.gz:ro" \
            docker:28.5.2-dind dockerd --host=unix:///var/run/docker.sock
          trap 'docker rm -fv publish-dind >/dev/null' EXIT
          for i in {1..60}; do
            if docker exec publish-dind docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec publish-dind docker load -i /image.tar.gz
          printf '%s' "$GHCR_TOKEN" | docker exec -i publish-dind docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker exec publish-dind docker tag library-app:0.1.0 "$image"
          docker exec publish-dind docker push "$image"
